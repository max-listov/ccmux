# CI + Release — one workflow for everything.
#
# Jobs:
#   ci      — Biome + typecheck + full test suite (every push / PR)
#   smoke   — build the prod bundle and RUN it (`version`, `list --json`): a bundle that
#             cannot even load dies here, before it can ever reach the fleet
#   darwin-native — the Darwin-only native companion test, on a macOS runner
#   release → publish-sdk → activate — verify the draft, publish the SDK to npm, then expose the fleet release
#
# Release invariants (docs/architecture/tui-and-dev-flow.md → «Раздача на флот»):
#   - a release is born ONLY from a tag, and the tag must equal package.json version;
#   - a red check = the release physically cannot happen;
#   - the manifest url points at the VERSIONED asset (manifest+bundle are an atomic pair);
#   - the signed draft and npm receive the same tested SDK archive.
#
# Release flow (ceremony is local, publish is CI):
#   bun run release X.Y.Z "notes"   # clean-tree guard → check → bump + CHANGELOG → commit → tag → push
#   → this workflow builds, verifies and publishes; the fleet self-updates via releaseUrl.

name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image for manual recovery
        required: false
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Draft upload, npm publishing and draft activation have separate credentials.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install tmux on macOS recovery runner
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Biome + typecheck + tests
        run: bun run check

  # The native companion test only runs on Darwin; on the default Linux runner it is skipped, so
  # without this job a broken arm64 companion would ship with every check green.
  darwin-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Native companion packaging
        run: bun test test/bundle-selfcontained.test.ts

  smoke:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: ci
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build bundle
        run: bun scripts/release.ts --stage

      # Run the BUILT artifact, not the source: `version` proves it loads at all,
      # `list --json` proves the command path works end-to-end. The runner has no claude
      # or tmux, so a stub machine.json (CCMUX_CONFIG) stands in for `ccmux install` —
      # /bin/false binaries exercise the "nothing running" path with an empty registry.
      # CI twin of the fleet-side preflight.
      - name: Smoke the bundle
        run: |
          BUNDLE="${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/staged/ccmux.js"
          test -f "$BUNDLE"
          PKG="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          OUT="$(bun "$BUNDLE" version)"
          echo "bundle reports: $OUT (package.json: $PKG)"
          [ "$OUT" = "ccmux $PKG" ]
          FALSE_BIN="/bin/false"
          [ -x "$FALSE_BIN" ] || FALSE_BIN="/usr/bin/false"
          cat > "$RUNNER_TEMP/machine.json" <<EOF
          {
            "claudeBin": "$FALSE_BIN",
            "tmuxBin": "$FALSE_BIN",
            "projectsDir": "$RUNNER_TEMP/projects",
            "rcPrefix": "ci",
            "stateDir": "$RUNNER_TEMP/state",
            "bootLabel": "ccmux.ci"
          }
          EOF
          CCMUX_CONFIG="$RUNNER_TEMP/machine.json" bun "$BUNDLE" list --json | bun -e 'const d = await new Response(Bun.stdin.stream()).json(); if (!Array.isArray(d.sessions)) { console.error("bad list --json shape"); process.exit(1); }'
          echo "list --json OK"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: [ci, smoke, darwin-native]
    permissions:
      contents: write
    outputs:
      sdk-artifact: ${{ steps.sdk.outputs.artifact-id }}
      sdk-sha256: ${{ steps.test-sdk.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history — release notes read the CHANGELOG section for this tag

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Resume an incomplete draft only for the same commit. A public release is immutable.
      - name: Inspect release
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          error_file="$RUNNER_TEMP/release-query.err"
          if info=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>"$error_file"); then
            if jq -e '.isDraft' <<<"$info" >/dev/null; then
              jq -e --arg sha "$GITHUB_SHA" '.targetCommitish == $sha' <<<"$info" >/dev/null
              echo "draft=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -qx 'release not found' "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Build release assets
        if: steps.fresh.outputs.exists != 'true'
        env:
          # Signs release.json; a release the fleet cannot verify is not published (src/release/trust.ts).
          CCMUX_RELEASE_SIGNING_KEY: ${{ secrets.CCMUX_RELEASE_SIGNING_KEY }}
        run: bun scripts/release.ts --ci-assets "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/ccmux.js"

      - name: Test the exact SDK candidate
        id: test-sdk
        if: steps.fresh.outputs.exists != 'true'
        run: |
          releases="${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases"
          archive="ccmux-control-service-client-${GITHUB_REF_NAME#v}.tgz"
          CCMUX_PACKED_CLIENT_ARTIFACT="$releases/$archive" bun scripts/verify-control-service-client.ts
          mkdir "$RUNNER_TEMP/sdk"
          cp "$releases/$archive" "$RUNNER_TEMP/sdk/$archive"
          echo "sha256=$(shasum -a 256 "$RUNNER_TEMP/sdk/$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section
        if: steps.fresh.outputs.exists != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then BODY="ccmux $GITHUB_REF_NAME"; fi
          echo "$BODY" > /tmp/release-notes.md

      - name: Prepare GitHub draft
        if: steps.fresh.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.fresh.outputs.draft }}" != 'true' ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --target "$GITHUB_SHA" \
              --title "ccmux $GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --draft
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/ccmux.js" "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/release.json" scripts/install.sh \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/monitoring-reader.js" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/monitoring-reader.sha256" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/codex-runtime-reader.js" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/codex-runtime-reader.sha256" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/control-client.js" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/control-client.sha256" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/ccmux-control-service-client-${GITHUB_REF_NAME#v}.tgz" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/control-service-client.sha256" \
            "${XDG_CACHE_HOME:-$HOME/.cache}/ccmux/releases/ccmux-${GITHUB_REF_NAME#v}.tgz"

      - name: Seal the tested SDK for npm
        id: sdk
        if: steps.fresh.outputs.exists != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: control-client-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk/*.tgz
          if-no-files-found: error
          retention-days: 3

  publish-sdk:
    needs: release
    if: needs.release.outputs.sdk-artifact != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.release.outputs.sdk-artifact }}
          path: ${{ runner.temp }}/sdk
      - name: Publish with OIDC and verify the publicly served archive
        env:
          EXPECTED_SHA256: ${{ needs.release.outputs.sdk-sha256 }}
        run: bun scripts/publish-control-client.ts "$RUNNER_TEMP/sdk/ccmux-control-service-client-${GITHUB_REF_NAME#v}.tgz" "$EXPECTED_SHA256"
      - name: Install by version from public npm
        run: bun scripts/verify-control-service-client.ts --from-npm

  activate:
    needs: [release, publish-sdk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ needs.release.outputs.sdk-sha256 }}
        run: |
          sdk="ccmux-control-service-client-${GITHUB_REF_NAME#v}.tgz"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,assets |
            jq -e --arg sha "$GITHUB_SHA" --arg file "$sdk" --arg digest "sha256:$EXPECTED_SHA256" \
              '.isDraft and .targetCommitish == $sha and any(.assets[]; .name == $file and .digest == $digest)'
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
